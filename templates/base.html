<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}{{ app_name }}{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/app.css') }}"
    >

    {% block head %}{% endblock %}
</head>

<body>
    <header class="app-header">
        <div class="app-header__brand">
            <div class="app-header__logo">
                FD+
            </div>

            <div>
                <div class="app-header__title">
                    {{ app_name }}
                </div>

                <div class="app-header__subtitle">
                    Sistema editorial de montagem de apostilas
                </div>
            </div>
        </div>

        <div class="app-header__version">
            v{{ app_version }}
        </div>
    </header>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <span>
            {{ editor.nome }}
        </span>

        <span>
            {{ editor.site }}
        </span>
    </footer>

    <script
        src="{{ url_for('static', path='/js/app.js') }}"
        defer
    ></script>

    {% block scripts %}{% endblock %}
</body>
</html>
